# SPDX-License-Identifier: GPL-3.0-or-later
# Builds and tests lrvne on every push and pull request.
#
#   host    the headless backend: unit tests and the smoke test under the sanitizers, with
#           and without the ymfm core, and a build with the Opus decoder; Linux and macOS
#   sdl3    the SDL3 backend. Built on macOS only, with Homebrew's SDL3: the Ubuntu runner
#           image (24.04) has no SDL3 package. Move it into a matrix with ubuntu-latest once
#           that image is a release that ships libsdl3-dev.
#   checks  the leak check over the tracked files and the Python tools' tests (`make check`
#           skips the latter while the checkout has no tools/tests)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ymfm: [1, 0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # the makefiles need GNU Make 4; macOS ships 3.81
      - name: GNU Make (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build
        run: make -j4 LRVNE_YMFM=${{ matrix.ymfm }}
      - name: Test with the sanitizers
        run: make -j4 test SAN=1 LRVNE_YMFM=${{ matrix.ymfm }}
      - name: Test with the Opus decoder
        run: make -j4 test LRVNE_OPUS=1 LRVNE_YMFM=${{ matrix.ymfm }}

  sdl3:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: GNU Make, pkg-config and SDL3
        run: |
          brew install make pkgconf sdl3
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build
        run: make -j4 TARGET=sdl3
      - name: Build with every switch
        run: make -j4 TARGET=sdl3 LRVNE_OPUS=1 LRVNE_YMFM=0 LRVNE_CONTROL=0

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leak check
        run: scripts/check-leaks.sh tree
      - name: Tests, tools' tests, leak check
        run: make -j4 check
